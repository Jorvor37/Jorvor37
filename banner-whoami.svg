<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="900" height="70">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1a0500"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="70" fill="url(#bannerBg)" rx="6"/>
  <!-- Left red bar -->
  <rect x="0" y="0" width="6" height="70" fill="#cc2200"/>
  <!-- Right kanji -->
  <text x="860" y="44" font-family="serif" font-size="24" fill="#cc2200" opacity="0.6" text-anchor="middle">識</text>
  <!-- Decorative dots -->
  <circle cx="40" cy="20" r="1.5" fill="#cc2200" opacity="0.6"/>
  <circle cx="40" cy="50" r="1.5" fill="#cc2200" opacity="0.6"/>
  <!-- Terminal prompt -->
  <text x="60" y="44" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#cc2200">$</text>
  <text x="90" y="44" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#ffffff">whoami</text>
  <!-- Animated cursor -->
  <rect x="200" y="28" width="12" height="22" fill="#cc2200">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Subtle bottom line -->
  <line x1="0" y1="68" x2="900" y2="68" stroke="#cc2200" stroke-width="0.5" opacity="0.4"/>
</svg>
