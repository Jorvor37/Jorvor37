<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#2a0500"/>
      <stop offset="50%" stop-color="#150200"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="dragonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3300"/>
      <stop offset="50%" stop-color="#cc2200"/>
      <stop offset="100%" stop-color="#660000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bgGlow)" rx="14"/>

  <!-- Mountain silhouette backdrop -->
  <path d="M 0 240 L 100 180 L 180 220 L 280 160 L 380 200 L 480 150 L 580 190 L 680 170 L 780 210 L 900 180 L 900 280 L 0 280 Z"
        fill="#0a0a0a" opacity="0.6"/>

  <!-- Sun/moon circle -->
  <circle cx="730" cy="80" r="42" fill="#cc2200" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.4;0.25" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="80" r="36" fill="#ff3300" opacity="0.5"/>

  <!-- Decorative kanji -->
  <text x="50" y="50" font-family="serif" font-size="32" fill="#cc2200" opacity="0.4">龍</text>
  <text x="830" y="240" font-family="serif" font-size="32" fill="#cc2200" opacity="0.4">炎</text>
  <text x="450" y="30" font-family="serif" font-size="13" fill="#999" opacity="0.5" text-anchor="middle" letter-spacing="6">エンジニア・革新者</text>

  <!-- ANIMATED FLOATING EMBERS (lots, varied) -->
  <g>
    <circle r="2" fill="#ff6600">
      <animateMotion dur="4s" repeatCount="indefinite"
        path="M 100,260 Q 110,180 95,100 T 110,20"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="#ffaa00">
      <animateMotion dur="5s" repeatCount="indefinite"
        path="M 200,260 Q 215,170 195,80 T 210,10"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#ff3300">
      <animateMotion dur="3.5s" repeatCount="indefinite"
        path="M 320,260 Q 305,180 315,100 T 305,10"/>
      <animate attributeName="opacity" values="0;1;0.6;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="#ffcc00">
      <animateMotion dur="6s" repeatCount="indefinite"
        path="M 460,260 Q 475,170 455,80 T 470,10"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#ff5500">
      <animateMotion dur="4.5s" repeatCount="indefinite"
        path="M 600,260 Q 590,170 605,80 T 595,10"/>
      <animate attributeName="opacity" values="0;1;0.7;0" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="#ffaa00">
      <animateMotion dur="5.5s" repeatCount="indefinite"
        path="M 750,260 Q 765,170 745,80 T 760,10"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#ff6600">
      <animateMotion dur="3.8s" repeatCount="indefinite"
        path="M 850,260 Q 840,180 855,100 T 840,20"/>
      <animate attributeName="opacity" values="0;1;0.8;0" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- THE DRAGON — undulating serpentine path -->
  <g filter="url(#glow)">
    <!-- Main body (animated d attribute makes it swim) -->
    <path stroke="url(#dragonGrad)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.95">
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
        values="
          M 60 180 Q 130 120 200 170 Q 270 220 340 150 Q 410 80 480 130 Q 550 180 620 110 Q 690 40 760 90 Q 820 130 870 100;
          M 60 170 Q 130 130 200 180 Q 270 210 340 140 Q 410 70 480 140 Q 550 190 620 120 Q 690 50 760 80 Q 820 120 870 90;
          M 60 180 Q 130 120 200 170 Q 270 220 340 150 Q 410 80 480 130 Q 550 180 620 110 Q 690 40 760 90 Q 820 130 870 100
        "/>
    </path>
    <!-- Secondary body shadow for depth -->
    <path stroke="#ff4400" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5">
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
        values="
          M 60 180 Q 130 120 200 170 Q 270 220 340 150 Q 410 80 480 130 Q 550 180 620 110 Q 690 40 760 90 Q 820 130 870 100;
          M 60 170 Q 130 130 200 180 Q 270 210 340 140 Q 410 70 480 140 Q 550 190 620 120 Q 690 50 760 80 Q 820 120 870 90;
          M 60 180 Q 130 120 200 170 Q 270 220 340 150 Q 410 80 480 130 Q 550 180 620 110 Q 690 40 760 90 Q 820 130 870 100
        "/>
    </path>

    <!-- Scale dots along body — each animates its own y -->
    <circle cx="200" cy="170" r="5" fill="#cc2200">
      <animate attributeName="cy" values="170;180;170" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="150" r="5" fill="#cc2200">
      <animate attributeName="cy" values="150;140;150" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="130" r="5" fill="#cc2200">
      <animate attributeName="cy" values="130;140;130" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="110" r="5" fill="#cc2200">
      <animate attributeName="cy" values="110;120;110" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="90" r="5" fill="#cc2200">
      <animate attributeName="cy" values="90;80;90" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Whiskers from head -->
    <path stroke="#ffaa00" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7">
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
        values="
          M 60 178 Q 40 175 30 165 M 60 182 Q 40 188 32 198;
          M 60 168 Q 40 165 30 155 M 60 172 Q 40 178 32 188;
          M 60 178 Q 40 175 30 165 M 60 182 Q 40 188 32 198
        "/>
    </path>

    <!-- Dragon HEAD -->
    <g>
      <ellipse cx="72" cy="180" rx="18" ry="11" fill="#cc2200">
        <animate attributeName="cy" values="180;170;180" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Horns -->
      <path stroke="#ffaa00" stroke-width="2.5" fill="none" stroke-linecap="round">
        <animate attributeName="d" dur="4s" repeatCount="indefinite"
          values="
            M 70 170 L 65 155 M 78 170 L 80 153;
            M 70 160 L 65 145 M 78 160 L 80 143;
            M 70 170 L 65 155 M 78 170 L 80 153
          "/>
      </path>
      <!-- Glowing eye -->
      <circle cx="65" cy="178" r="3.5" fill="#ffdd00" filter="url(#strongGlow)">
        <animate attributeName="cy" values="178;168;178" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.5;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Tail with curl -->
    <path stroke="#cc2200" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
        values="
          M 870 100 Q 890 80 885 60 Q 880 45 895 40;
          M 870 90 Q 890 70 885 50 Q 880 35 895 30;
          M 870 100 Q 890 80 885 60 Q 880 45 895 40
        "/>
    </path>
  </g>

  <!-- TITLE TEXT -->
  <text x="450" y="155" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold"
        fill="#ffffff" text-anchor="middle" letter-spacing="6" filter="url(#glow)">
    KONGPHOP K.
  </text>

  <!-- Subtitle -->
  <text x="450" y="195" font-family="Georgia, serif" font-size="14"
        fill="#ff4400" text-anchor="middle" letter-spacing="10">
    SOFTWARE  ·  HARDWARE  ·  AI
  </text>

  <!-- Tagline -->
  <line x1="280" y1="215" x2="620" y2="215" stroke="#cc2200" stroke-width="0.6" opacity="0.5"/>
  <text x="450" y="235" font-family="Georgia, serif" font-size="11.5"
        fill="#888888" text-anchor="middle" letter-spacing="3" font-style="italic">
    Computer Engineering  ·  MUIC  ·  Building what's next
  </text>

  <!-- Bottom flame wave -->
  <path stroke="#cc2200" stroke-width="1.2" fill="none" opacity="0.5">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="
        M 0 265 Q 225 250 450 265 Q 675 280 900 265;
        M 0 265 Q 225 280 450 265 Q 675 250 900 265;
        M 0 265 Q 225 250 450 265 Q 675 280 900 265
      "/>
  </path>
</svg>
