<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="40%" stop-color="#0e0200"/>
      <stop offset="60%" stop-color="#0e0200"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <pattern id="scales" x="0" y="0" width="20" height="14" patternUnits="userSpaceOnUse">
      <path d="M 0 7 Q 5 0 10 7" stroke="#cc2200" stroke-width="0.6" fill="none" opacity="0.10"/>
      <path d="M 10 7 Q 15 0 20 7" stroke="#cc2200" stroke-width="0.6" fill="none" opacity="0.10"/>
      <path d="M -10 14 Q -5 7 0 14" stroke="#cc2200" stroke-width="0.6" fill="none" opacity="0.07"/>
      <path d="M 0 14 Q 5 7 10 14" stroke="#cc2200" stroke-width="0.6" fill="none" opacity="0.07"/>
      <path d="M 10 14 Q 15 7 20 14" stroke="#cc2200" stroke-width="0.6" fill="none" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="900" height="240" fill="url(#bg)" rx="8"/>
  <rect width="900" height="240" fill="url(#scales)" rx="8"/>
  <rect x="0" y="0" width="4" height="240" fill="#cc2200" rx="1" opacity="0.9"/>
  <line x1="0" y1="1" x2="900" y2="1" stroke="#cc2200" stroke-width="0.3" opacity="0.15"/>
  <line x1="0" y1="239" x2="900" y2="239" stroke="#cc2200" stroke-width="0.5" opacity="0.4"/>

  <!-- Row 1 -->
  <text x="40" y="52" font-family="Georgia, serif" font-size="14" fill="#ff4400" letter-spacing="2">co-founder</text>
  <text x="170" y="52" font-family="Georgia, serif" font-size="14" fill="#ff4400" opacity="0.4">·</text>
  <text x="192" y="52" font-family="Georgia, serif" font-size="14" fill="#ffffff" opacity="0.75" letter-spacing="1">Refinery.co</text>

  <!-- Row 2 -->
  <text x="40" y="84" font-family="Georgia, serif" font-size="14" fill="#ff4400" letter-spacing="2">degree</text>
  <text x="170" y="84" font-family="Georgia, serif" font-size="14" fill="#ff4400" opacity="0.4">·</text>
  <text x="192" y="84" font-family="Georgia, serif" font-size="14" fill="#ffffff" opacity="0.75" letter-spacing="1">B.Eng Computer Engineering — MUIC</text>

  <!-- Row 3 -->
  <text x="40" y="116" font-family="Georgia, serif" font-size="14" fill="#ff4400" letter-spacing="2">focus</text>
  <text x="170" y="116" font-family="Georgia, serif" font-size="14" fill="#ff4400" opacity="0.4">·</text>
  <text x="192" y="116" font-family="Georgia, serif" font-size="14" fill="#ffffff" opacity="0.75" letter-spacing="1">AI-driven products at scale</text>

  <!-- Row 4 -->
  <text x="40" y="148" font-family="Georgia, serif" font-size="14" fill="#ff4400" letter-spacing="2">location</text>
  <text x="170" y="148" font-family="Georgia, serif" font-size="14" fill="#ff4400" opacity="0.4">·</text>
  <text x="192" y="148" font-family="Georgia, serif" font-size="14" fill="#ffffff" opacity="0.75" letter-spacing="1">Bangkok, Thailand</text>

  <!-- Divider before quote -->
  <line x1="40" y1="170" x2="860" y2="170" stroke="#cc2200" stroke-width="0.5" opacity="0.3"/>

  <!-- Quote -->
  <text x="250" y="198" font-family="Georgia, serif" font-size="13" font-style="italic"
        fill="#ff4400" opacity="0.6" text-anchor="middle" letter-spacing="1">
    &#8220; The craftsman who masters the tool, masters the outcome. &#8221;
  </text>

  <!-- Right kanji -->
  <text x="868" y="110" font-family="Georgia, serif" font-size="26"
        fill="#cc2200" opacity="0.3" text-anchor="middle">我</text>

  <!-- Diamond accents -->
  <path d="M 840 55 L 846 48 L 852 55 L 846 62 Z" fill="none" stroke="#cc2200" stroke-width="0.6" opacity="0.25"/>
  <path d="M 840 148 L 846 141 L 852 148 L 846 155 Z" fill="none" stroke="#cc2200" stroke-width="0.6" opacity="0.25"/>
</svg>
